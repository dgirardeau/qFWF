[Projection]
; Horizontal step
HorizStep = 0.25
; Vertical step
VertStep = 0.1
; Interpolation radius
InterpRadius = 0.6
; Interpolation method
InterpMethod = INV_EXP

[WaveformExtraction]
; Peak detector (NAIVE, NLS_GAUSS)
Detector = NLS_GAUSS
; Min peak amplitude
MinAmplitude = 0
; Max number of peaks
MaxReturnCount = 2
; Bits per sample (8, 16 or 32)
BitPerSample = 16
; Waveform length
NumberOfSamples = 64

[Export]
; Export format: BIN or LAS or LAZ (qLAS_FWF plugin is required) for LAS or LAZ)
Format = LAS